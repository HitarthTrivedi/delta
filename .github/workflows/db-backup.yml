name: Database backup

# Nightly off-site backup of the production database (app data in the public
# schema). The dump is encrypted with `age` before it leaves the runner; only
# the holder of the offline private key can read it. Stored in Cloudflare R2,
# where a bucket lifecycle rule deletes copies after 30 days.
# Setup and restore steps: docs/OPERATIONS.md ("Backups").
# Note: GitHub runs scheduled workflows from the default branch (main) only.

on:
  schedule:
    - cron: "30 21 * * *"  # 03:00 IST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
      AGE_RECIPIENT: ${{ secrets.AGE_RECIPIENT }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - name: Check configuration
        run: |
          missing=""
          for v in DATABASE_URL AGE_RECIPIENT AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY R2_BUCKET; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Backup secrets not set:$missing (see docs/OPERATIONS.md)"
            exit 1
          fi

      - name: Install pg_dump 17 and age
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common age
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Dump, verify and encrypt
        run: |
          set -euo pipefail
          umask 077
          name="delta-$(date -u +%Y-%m-%dT%H%M)Z.dump"
          /usr/lib/postgresql/17/bin/pg_dump --dbname="$DATABASE_URL" \
            --format=custom --schema=public --no-owner --no-privileges \
            --file="$name"
          # A usable dump must list table data; fail loudly on an empty one.
          tables=$(/usr/lib/postgresql/17/bin/pg_restore --list "$name" | grep -c "TABLE DATA" || true)
          echo "Tables with data entries: $tables"
          [ "$tables" -gt 0 ] || { echo "::error::Dump has no table data"; exit 1; }
          age -r "$AGE_RECIPIENT" -o "$name.age" "$name"
          shred -u "$name"
          echo "FILE=$name.age" >> "$GITHUB_ENV"

      - name: Upload to Cloudflare R2
        run: |
          aws s3 cp "$FILE" "s3://$R2_BUCKET/db/$FILE" --endpoint-url "$R2_ENDPOINT" --only-show-errors
          echo "Uploaded db/$FILE ($(stat -c %s "$FILE") bytes)"
